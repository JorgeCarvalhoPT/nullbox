# A reusable config preset. Saved templates live under NULLBOX_TEMPLATES (or
# <user-config>/nullbox/templates). An engagement opts in with
# `spec.template: acme-standard`; these values fill the fields it leaves unset.
# Scope, window, and authorization are always per-engagement — never here.
name: acme-standard
driver: firecracker
image: ghcr.io/acme/pentest-agent:v1   # any AI pentesting agent's OCI image
network:
  profile: routed
capabilities:
  infraTools: true
evidence:
  retainFlows: true
  retainDays: 400
