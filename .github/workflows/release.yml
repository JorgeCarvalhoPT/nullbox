name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # Skip the Homebrew cask when the tap token isn't configured yet, so
          # the binary release (curl installer) still publishes cleanly. Add the
          # HOMEBREW_TAP_TOKEN secret to enable brew on the next release.
          args: ${{ secrets.HOMEBREW_TAP_TOKEN != '' && 'release --clean' || 'release --clean --skip=homebrew' }}
        env:
          # Creates the GitHub release + uploads binaries:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the generated Homebrew formula to <owner>/homebrew-tap.
          # Create a PAT with `repo` scope on that tap repo and add it as the
          # HOMEBREW_TAP_TOKEN secret. (Only needed for the brew tap.)
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
